<script>
// Opens straight onto a map: the city you were last in, or Kolkata. Links shared before the
// cities were merged pointed here (Kolkata was the only map), so their #... is passed along.
(function () {
  var city = 'kolkata';
  if (!/^#(\/place\/|x=)/.test(location.hash)) { try { var c = localStorage.getItem('wtm-city'); if (c === 'kolkata' || c === 'bengaluru') city = c; } catch (e) {} }
  location.replace(city + '/' + (location.protocol === 'file:' ? 'index.html' : '') + location.hash);
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 16px; text-align: center; font: 18px/1.4 sans-serif; background: #1d4f91; color: #f4f2ea; }
  a { color: #f6c417; font-weight: 700; }
</style>
